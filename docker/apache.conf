# Apache settings for the container. The access rules of the program live in the .htaccess files, so overrides must be on.
<Directory /var/www/html>
    AllowOverride All
    Require all granted
</Directory>

# Behind a TLS-terminating proxy (Caddy, Traefik, nginx, a cloud load balancer): tell PHP the visitor used HTTPS.
# This turns on the Secure __Host- session cookie and the HSTS header, and stops the HTTP-to-HTTPS redirect from looping.
SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

# Visitors' own addresses for the rate limiter and the sign-in lockout (mod_remoteip) are switched on by
# entrypoint.sh when CRM_TRUSTED_PROXY is set; see docs/INSTALL.md, "Docker".
