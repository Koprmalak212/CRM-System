; Production settings. The program also sets display_errors=0 and logs to storage/php-error.log itself.
expose_php = Off
date.timezone = ${CRM_TIMEZONE}
; profile pictures: 2 MB files (AVATAR_MAX_BYTES), GIFs included
upload_max_filesize = 3M
post_max_size = 5M
opcache.enable = 1
opcache.validate_timestamps = 0
